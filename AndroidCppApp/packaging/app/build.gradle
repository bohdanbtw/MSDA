plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Version is the single source of truth in gradle.properties; fail fast if missing.
def appVersionName = project.findProperty('app.version.name')?.toString()
if (!appVersionName) {
    throw new GradleException('app.version.name is missing from gradle.properties')
}
def appVersionCode = project.findProperty('app.version.code')?.toString()?.toInteger()
if (appVersionCode == null) {
    throw new GradleException('app.version.code is missing from gradle.properties')
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    logger.lifecycle("keystore.properties not found. Release builds require AndroidCppApp/tools/setup-release-signing.ps1")
}

// Optional extra pin for self-updates: SHA-256 of the release signing certificate.
// Blank means "must be signed by the same key as the installed app" (platform APIs).
def updateSigningFingerprint = (project.findProperty('app.update.signing.sha256') ?: '')
        .toString().trim().replace('\\', '\\\\').replace('"', '\\"')

android {
    namespace 'com.msda.android'
    // 35 is the newest platform available offline in the build environment and
    // satisfies Google Play's 35+ target requirement for new releases.
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.msda.android"
        minSdk 26
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
        resValue "string", "settings_app_version", "Version ${versionName}"
        buildConfigField "String", "UPDATE_SIGNING_SHA256", "\"${updateSigningFingerprint}\""

        // Only the 64-bit ARM library is bundled (src/main/jniLibs/arm64-v8a/
        // libmsda_android.so). Declaring it explicitly prevents an APK that
        // silently claims to support ABIs it cannot run on. The app therefore
        // requires a 64-bit ARM device (see AndroidCppApp/README.md).
        ndk {
            // arm64-v8a is the shipped device ABI; x86_64 enables local emulator testing.
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        release {
            def storePath = keystoreProperties['storeFile'] ?: 'release.jks'
            storeFile rootProject.file(storePath)
            storePassword keystoreProperties['storePassword'] ?: ''
            keyAlias keystoreProperties['keyAlias'] ?: 'upload'
            keyPassword keystoreProperties['keyPassword'] ?: ''
        }
    }

    buildTypes {
        release {
            // R8 code shrinking/obfuscation for release builds. Keep rules in
            // proguard-rules.pro protect the JNI bridge and data models.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "MSDA-${variant.versionName}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // Local JVM unit tests run against the android.jar stubs, whose methods throw
    // "not mocked" by default. Returning default values lets logging calls (e.g.
    // android.util.Log.e in PasswordManager) no-op so Keystore-dependent code can
    // exercise its fail-closed path instead of crashing the test runner.
    testOptions {
        unitTests.returnDefaultValues = true
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.protobuf:protobuf-javalite:3.25.5'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    testImplementation 'org.json:json:20240303'
}
