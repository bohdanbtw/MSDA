# Gradle properties for MSDA Android package

# Use JAVA_HOME environment variable to specify a JDK 17.
# Set JAVA_HOME=C:\....\jdk-17 before running any Gradle command.
# Uncomment and adjust the line below if you prefer to hard-code the path.
# org.gradle.java.home=C\:\\Program Files\\Eclipse Adoptium\\jdk-17.0.12.7-hotspot

# Enable AndroidX
android.useAndroidX=true

# JVM arguments for both the wrapper and the build
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED

# Kotlin code style
kotlin.code.style=official

app.version.name=1.3.0
app.version.code=5

# Release signing configuration
# Generate a keystore with:
# keytool -genkey -v -keystore release.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass YOUR_STORE_PASSWORD -keypass YOUR_KEY_PASSWORD
# then place the keystore file in the packaging/ directory (next to this file).
MYAPP_RELEASE_STORE_FILE=release.jks
MYAPP_RELEASE_STORE_PASSWORD=YOUR_STORE_PASSWORD
MYAPP_RELEASE_KEY_ALIAS=upload
MYAPP_RELEASE_KEY_PASSWORD=YOUR_KEY_PASSWORD
