# Gradle properties for MSDA Android package

# App version - single source of truth for versionCode, versionName,
# the settings footer string and the generated APK file name.
app.version.name=1.5.0
app.version.code=150000

android.useAndroidX=true
kotlin.code.style=official

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED

# Release signing lives in keystore.properties (local only, gitignored).
# First-time setup:
#   powershell -ExecutionPolicy Bypass -File AndroidCppApp\tools\setup-release-signing.ps1
# Template:
#   AndroidCppApp\packaging\keystore.properties.example

# Optional self-update signing pin: SHA-256 of the release signing certificate
# (hex, colons/spaces allowed). When set, a downloaded APK must match this value
# as well as the certificate of the installed app. Leave blank to rely on the
# installed app's certificate alone.
# app.update.signing.sha256=AA:BB:CC:...
