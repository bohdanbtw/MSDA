# Gradle properties for MSDA Android package

# Use JAVA_HOME environment variable to specify a JDK 17.
# Set JAVA_HOME=C:\....\jdk-17 before running any Gradle command.
# Uncomment and adjust the line below if you prefer to hard-code the path.
# org.gradle.java.home=C\:\\Program Files\\Eclipse Adoptium\\jdk-17.0.12.7-hotspot

# Enable AndroidX
android.useAndroidX=true

# JVM arguments for both the wrapper and the build
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED

# Kotlin code style
kotlin.code.style=official

app.version.name=1.2.1
app.version.code=4
