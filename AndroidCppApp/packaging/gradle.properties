# Gradle properties for MSDA Android package

android.useAndroidX=true
kotlin.code.style=official

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED

# Release signing lives in keystore.properties (local only, gitignored).
# First-time setup:
#   powershell -ExecutionPolicy Bypass -File AndroidCppApp\tools\setup-release-signing.ps1
# Template:
#   AndroidCppApp\packaging\keystore.properties.example
